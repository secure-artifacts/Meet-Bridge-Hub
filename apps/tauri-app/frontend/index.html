<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet Bridge Hub</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #10141b; color: #f5f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; background: radial-gradient(circle at 100% 0, #263a61 0, transparent 34%), #10141b; }
      main { max-width: 760px; margin: 0 auto; padding: 22px; }
      h1, h2, p { margin: 0; }
      header, .section-head, .service-row, .mic-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      h1 { font-size: 25px; letter-spacing: -.03em; }
      h2 { font-size: 14px; }
      .build, .hint, .diagnostic { color: #aeb8c9; font-size: 12px; line-height: 1.45; }
      .build { margin-top: 3px; }
      .state { border-radius: 999px; padding: 6px 10px; background: #173d31; color: #75dfaa; font-size: 12px; font-weight: 700; white-space: nowrap; }
      .card { margin-top: 12px; padding: 14px; border: 1px solid #2b3546; border-radius: 13px; background: rgba(26, 32, 43, .94); }
      .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 11px; }
      .metric { min-width: 0; padding: 10px; border-radius: 9px; background: #10151e; }
      .metric span { display: block; overflow: hidden; color: #98a5ba; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .metric strong { display: block; margin-top: 4px; color: #f5f7fb; font-size: 18px; }
      .address { margin-top: 9px; color: #aeb8c9; font-size: 12px; }
      code { color: #b8c9ff; }
      .timing { margin-top: 10px; color: #aeb8c9; font-size: 11px; }
      .service-row + .service-row, .mic-row { margin-top: 11px; border-top: 1px solid #2b3546; padding-top: 11px; }
      .service-copy { min-width: 0; }
      .service-copy strong { font-size: 13px; }
      button { flex: 0 0 auto; min-height: 34px; border: 0; border-radius: 8px; padding: 0 11px; background: #5267ed; color: #fff; font: 700 12px inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .secondary { background: #263651; color: #cdd9ff; }
      .pairing { margin-top: 11px; border-top: 1px solid #2b3546; padding-top: 11px; }
      .pairing > p { color: #aeb8c9; font-size: 12px; }
      .pairing-code { display: inline-flex; align-items: center; gap: 9px; margin: 8px 7px 0 0; padding: 7px 8px 7px 10px; border-radius: 8px; background: #10141b; }
      .pairing-code code { font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
      .pairing-code button { min-height: 30px; }
      details { margin-top: 10px; }
      summary { color: #aeb8c9; cursor: pointer; font-size: 12px; }
      .diagnostic { margin-top: 6px; overflow-wrap: anywhere; }
      @media (max-width: 480px) { main { padding: 14px; } .metrics { gap: 6px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Meet Bridge Hub</h1><p class="build">0.1.3 · 本地音频桥接版</p></div>
        <span id="state" class="state">正在检查…</span>
      </header>

      <section class="card">
        <div class="section-head"><h2>桥接状态</h2><span id="address" class="address">未连接</span></div>
        <div class="metrics">
          <div class="metric"><span>已授权端点</span><strong id="sessions">0</strong></div>
          <div class="metric"><span>认证音频连接</span><strong id="audio-connections">0</strong></div>
          <div class="metric"><span>接收音频帧</span><strong id="audio-frames">0</strong></div>
          <div class="metric"><span>拒绝音频帧</span><strong id="audio-rejected">0</strong></div>
        </div>
        <p id="audio-timing" class="timing">音频缓冲：等待连接</p>
        <details><summary>本地诊断信息</summary><p id="diagnostic-path" class="diagnostic"></p></details>
      </section>

      <section class="card">
        <div class="service-row">
          <div class="service-copy"><strong>Chrome / Edge 扩展连接</strong><p id="native-host" class="hint">正在检查连接器…</p></div>
          <button id="native-host-install" class="secondary">安装连接器</button>
        </div>
        <div class="mic-row">
          <div class="service-copy"><strong>Hub 麦克风</strong><p id="microphone" class="hint">物理麦克风：未启动</p></div>
          <button id="microphone-toggle" class="secondary">启动麦克风</button>
        </div>
        <div class="pairing"><p id="pairing">没有待确认的 Profile。</p><p id="pairing-copy-status" class="hint"></p></div>
      </section>
    </main>
    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      let lastCopiedPairingCode = '';
      const text = (selector, value) => { document.querySelector(selector).textContent = value; };
      async function refresh() {
        if (!invoke) {
          text('#state', '桌面连接未就绪');
          document.querySelectorAll('button').forEach((button) => { button.disabled = true; });
          return;
        }
        try {
          const status = await invoke('hub_status');
          text('#state', 'Hub 正在本机运行');
          document.querySelector('#address').innerHTML = '仅本机 <code>' + status.bind_addr + '</code>';
          text('#sessions', status.active_sessions);
          text('#audio-connections', status.authenticated_audio_connections);
          text('#audio-frames', status.accepted_audio_frames);
          text('#audio-rejected', status.rejected_audio_frames);
          text('#diagnostic-path', '日志：' + status.diagnostic_log_path);
          text('#audio-timing', `音频欠载：${status.audio_queue_underruns}；队列溢出丢帧：${status.audio_queue_dropped_frames}；下行发送失败断开：${status.audio_slow_disconnects}`);
          text('#microphone', status.microphone_active ? '物理麦克风：正在使用' : '物理麦克风：未启动');
          text('#microphone-toggle', status.microphone_active ? '停止麦克风' : '启动麦克风');
          const nativeHostReady = await invoke('native_host_registered');
          text('#native-host', nativeHostReady ? 'Chrome / Edge 已就绪，仅允许本扩展连接' : '连接器尚未就绪；仅写入当前 Windows 用户。');
          text('#native-host-install', nativeHostReady ? '重新安装' : '安装连接器');
          renderPairing(status);
        } catch (error) { text('#state', 'Hub 状态读取失败：' + String(error)); }
      }
      async function copyPairingCode(code) {
        try { await navigator.clipboard.writeText(code); }
        catch { const fallback = document.createElement('textarea'); fallback.value = code; fallback.style.position = 'fixed'; fallback.style.opacity = '0'; document.body.append(fallback); fallback.select(); document.execCommand('copy'); fallback.remove(); }
        lastCopiedPairingCode = code;
        text('#pairing-copy-status', `已复制确认码 ${code}`);
      }
      function renderPairing(status) {
        const pairing = document.querySelector('#pairing');
        const copyStatus = document.querySelector('#pairing-copy-status');
        pairing.replaceChildren();
        if (status.pending_pair_codes.length) {
          if (!status.pending_pair_codes.includes(lastCopiedPairingCode)) { lastCopiedPairingCode = ''; copyStatus.textContent = ''; }
          pairing.append('将六码确认码输入对应浏览器 Profile 的扩展：');
          for (const code of status.pending_pair_codes) {
            const box = document.createElement('span'); box.className = 'pairing-code';
            const codeElement = document.createElement('code'); codeElement.textContent = code;
            const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = '复制'; copy.addEventListener('click', () => copyPairingCode(code));
            box.append(codeElement, copy); pairing.append(box);
          }
          return;
        }
        copyStatus.textContent = '';
        const pairedProfiles = Number(status.paired_profiles || 0);
        pairing.textContent = pairedProfiles ? `已配对匿名 Profile：${pairedProfiles} 个。可在扩展中将会议页面加入频道。` : '没有待确认或已配对的 Profile。';
      }
      document.querySelector('#microphone-toggle').addEventListener('click', async () => {
        if (!invoke) return;
        const status = await invoke('hub_status');
        try { await invoke(status.microphone_active ? 'stop_microphone' : 'start_microphone'); }
        catch (error) { text('#state', '麦克风未启动：' + String(error)); }
        await refresh();
      });
      document.querySelector('#native-host-install').addEventListener('click', async () => {
        if (!invoke) return;
        try { await invoke('install_native_host'); text('#state', 'Chrome / Edge 连接器已安装'); }
        catch (error) { text('#state', 'Chrome / Edge 连接器未安装：' + String(error)); }
        await refresh();
      });
      refresh(); setInterval(refresh, 1000);
    </script>
  </body>
</html>
