[workspace]
resolver = "2"
members = [
    "crates/shared-proto",
    "crates/hub-core",
    "crates/native-broker",
    "apps/tauri-app/src-tauri",
]
default-members = [
    "crates/shared-proto",
    "crates/hub-core",
    "crates/native-broker",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
license = "Proprietary"
publish = false

[workspace.dependencies]
shared-proto = { package = "meet-bridge-shared-proto", path = "crates/shared-proto" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
semver = { version = "1.0", features = ["serde"] }
thiserror = "=2.0.20"
bytes = "=1.12.1"
bitflags = { version = "2.9", features = ["serde"] }

tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "connect"] }
futures-util = "0.3"
http = "1.3"

cpal = { version = "=0.18.2", features = ["realtime"] }
rubato = "=5.0.0"
rtrb = "=0.4.0"

ring = { version = "=0.17.14", features = ["std"] }
base64 = "=0.23.1"
zeroize = { version = "=1.9.0", features = ["derive"] }
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }

directories = "6.0"
parking_lot = "0.12"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "registry"] }

tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tauri-build = "=2.6.3"
tauri-plugin-updater = "=2.11.0"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
